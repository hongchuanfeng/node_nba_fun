<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NBA 记分板 · 静态页面示例</title>
    <style>
      :root {
        --bg: #0d1117;
        --bg-card: #161e29;
        --border: #243040;
        --text: #e8eef7;
        --text-soft: #9fb0c3;
        --accent: #f97316;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 48px 20px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.7;
      }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 26px; margin: 0 0 6px; }
      .sub { color: var(--text-soft); margin: 0 0 24px; }
      .board {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 64px 1fr;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .row:last-child { border-bottom: none; }
      .row:nth-child(odd) { background: rgba(255, 255, 255, 0.02); }
      .home { text-align: right; font-weight: 600; }
      .away { font-weight: 600; }
      .score { text-align: center; font-size: 20px; font-weight: 700; color: var(--accent); }
      .meta { color: var(--text-soft); font-size: 13px; }
      footer { color: var(--text-soft); font-size: 14px; margin-top: 24px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>记分板（静态示例）</h1>
      <p class="sub">public/tools/scoreboard.html — 子目录中的静态页面同样可以直接访问。</p>

      <div class="board">
        <div class="row">
          <span class="home">凯尔特人 <span class="meta">Celtics</span></span>
          <span class="score">108</span>
          <span class="away">勇士 <span class="meta">Warriors</span></span>
        </div>
        <div class="row">
          <span class="home">湖人 <span class="meta">Lakers</span></span>
          <span class="score">102</span>
          <span class="away">掘金 <span class="meta">Nuggets</span></span>
        </div>
        <div class="row">
          <span class="home">雄鹿 <span class="meta">Bucks</span></span>
          <span class="score">117</span>
          <span class="away">凯尔特人 <span class="meta">Celtics</span></span>
        </div>
        <div class="row">
          <span class="home">热火 <span class="meta">Heat</span></span>
          <span class="score">99</span>
          <span class="away">尼克斯 <span class="meta">Knicks</span></span>
        </div>
      </div>

      <footer>
        示例数据仅用于演示静态页面效果 · <a href="/demo.html">返回示例首页</a> ·
        <a href="/zh">进入站点</a>
      </footer>
    </main>
  </body>
</html>
